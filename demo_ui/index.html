<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG Pipeline — Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <h1>ESG Intelligence Pipeline</h1>
    <p>Multi-agent evidence gathering → deterministic scoring → per-company ESG results</p>
  </header>

  <div class="stage-rail" id="stageRail">
    <span class="stage-pill" data-stage="players">1. Key Players</span>
    <span class="stage-pill" data-stage="db">2. Database Check</span>
    <span class="stage-pill" data-stage="scoring">3. ESG Scoring</span>
  </div>

  <div class="market-picker">
    <select id="marketSelect"></select>
    <button id="runBtn" class="run-btn">Get ESG Data</button>
  </div>
  <div class="db-note" id="dbNote"></div>

  <div class="market-summary" id="marketSummary"></div>

  <div class="company-grid" id="companyGrid"></div>

  <div class="detail-panel" id="detailPanel"></div>

</div>

<script src="demo_data.js"></script>
<script src="app.js"></script>
</body>
</html>
